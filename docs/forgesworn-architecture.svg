<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace">
  <defs>
    <style>
      .hex-label { font-size: 13px; font-weight: 600; fill: #e2e8f0; text-anchor: middle; }
      .hex-count { font-size: 11px; font-weight: 400; fill: #94a3b8; text-anchor: middle; }
      .hex-sub { font-size: 10px; font-weight: 400; fill: #94a3b8; text-anchor: middle; }
      .ring-label { font-size: 9px; font-weight: 500; fill: #475569; text-anchor: middle; letter-spacing: 2px; text-transform: uppercase; }
      .title { font-size: 16px; font-weight: 600; fill: #e2e8f0; text-anchor: middle; }
      .subtitle { font-size: 11px; font-weight: 400; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="700" fill="#0a0a0f" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" class="title">ForgeSworn Ecosystem</text>
  <text x="400" y="52" class="subtitle">34 open-source tools built from the inside out</text>

  <!-- Architecture ring indicators -->
  <circle cx="400" cy="355" r="105" fill="none" stroke="#f5a623" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="2 4"/>
  <circle cx="400" cy="355" r="215" fill="none" stroke="#16c79a" stroke-width="0.5" stroke-opacity="0.15" stroke-dasharray="2 4"/>

  <!-- Connection lines (behind hexes) -->
  <!-- Core to Identity -->
  <line x1="400" y1="310" x2="400" y2="175" stroke="#f5a623" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Core to Trust -->
  <line x1="400" y1="310" x2="244" y2="445" stroke="#f5a623" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Core to L402 (dashed) -->
  <line x1="400" y1="310" x2="556" y2="445" stroke="#f5a623" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 3"/>
  <!-- Identity to Agents -->
  <line x1="400" y1="175" x2="556" y2="265" stroke="#16c79a" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Identity to L402 (dashed) -->
  <line x1="400" y1="175" x2="556" y2="445" stroke="#16c79a" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 3"/>
  <!-- Identity to Spatial (dashed) -->
  <line x1="400" y1="175" x2="400" y2="535" stroke="#16c79a" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 3"/>
  <!-- Trust to Identity (dashed) -->
  <line x1="244" y1="445" x2="400" y2="175" stroke="#9b59b6" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 3"/>
  <!-- Compliance to Identity -->
  <line x1="244" y1="265" x2="400" y2="175" stroke="#e17055" stroke-width="1" stroke-opacity="0.3"/>

  <!-- CORE: Crypto Foundation -->
  <g transform="translate(400,355)">
    <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="#1a1400" stroke="#f5a623" stroke-width="2.5"/>
    <text y="-12" class="hex-label" fill="#f5a623">Crypto</text>
    <text y="6" class="hex-count">4 libraries</text>
    <text y="22" class="hex-sub">ring-sig, range-proof</text>
    <text y="34" class="hex-sub">shamir-words, shamir-core</text>
  </g>

  <!-- Identity / Access -->
  <g transform="translate(400,175)">
    <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="#0a1f14" stroke="#16c79a" stroke-width="2.5"/>
    <text y="-20" class="hex-label" fill="#16c79a">Identity</text>
    <text y="-4" class="hex-count">10 repos</text>
    <text y="14" class="hex-sub">nsec-tree, heartwood</text>
    <text y="26" class="hex-sub">bark, sapwood, canary-kit</text>
  </g>

  <!-- AI Agents -->
  <g transform="translate(556,265)">
    <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="#001a24" stroke="#00b4d8" stroke-width="2.5"/>
    <text y="-12" class="hex-label" fill="#00b4d8">Agents</text>
    <text y="6" class="hex-count">1 repo</text>
    <text y="22" class="hex-sub">bray</text>
    <text y="34" class="hex-sub">234 tools, NIP-46 signing</text>
  </g>

  <!-- L402 / Payments -->
  <g transform="translate(556,445)">
    <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="#1f0a14" stroke="#e94560" stroke-width="2.5"/>
    <text y="-20" class="hex-label" fill="#e94560">L402</text>
    <text y="-4" class="hex-count">9 repos</text>
    <text y="14" class="hex-sub">toll-booth, 402-announce</text>
    <text y="26" class="hex-sub">402-mcp, 402-pub</text>
  </g>

  <!-- Trust / Privacy -->
  <g transform="translate(244,445)">
    <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="#1a0f24" stroke="#9b59b6" stroke-width="2.5"/>
    <text y="-12" class="hex-label" fill="#9b59b6">Trust</text>
    <text y="6" class="hex-count">2 repos</text>
    <text y="22" class="hex-sub">nostr-veil</text>
    <text y="34" class="hex-sub">nostr-attestations</text>
  </g>

  <!-- Compliance -->
  <g transform="translate(244,265)">
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#1f0f0a" stroke="#e17055" stroke-width="2"/>
    <text y="-8" class="hex-label" fill="#e17055" style="font-size:12px">Compliance</text>
    <text y="8" class="hex-count">1 repo</text>
    <text y="22" class="hex-sub">jurisdiction-kit</text>
  </g>

  <!-- Spatial -->
  <g transform="translate(400,535)">
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#0a0f1f" stroke="#0f3460" stroke-width="2"/>
    <text y="-8" class="hex-label" fill="#0f3460" style="font-size:12px">Spatial</text>
    <text y="8" class="hex-count">3 repos</text>
    <text y="22" class="hex-sub">rendezvous-kit, geohash-kit</text>
  </g>

  <!-- Legend -->
  <g transform="translate(660,620)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#f5a623" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="26" y="4" style="font-size:9px;fill:#64748b">depends on</text>
    <line x1="0" y1="16" x2="20" y2="16" stroke="#64748b" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 3"/>
    <text x="26" y="20" style="font-size:9px;fill:#64748b">integrates with</text>
  </g>

</svg>
