<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="sans-serif">

  <rect width="900" height="720" fill="#0a0a0f" rx="8"/>

  <text x="450" y="38" font-size="16" font-weight="600" fill="#e2e8f0" text-anchor="middle">ForgeSworn Ecosystem</text>
  <text x="450" y="56" font-size="10" fill="#64748b" text-anchor="middle">34 open-source tools built from the inside out</text>

  <!-- Rings -->
  <circle cx="450" cy="380" r="120" fill="none" stroke="#f5a623" stroke-width="0.4" stroke-opacity="0.12" stroke-dasharray="3 5"/>
  <circle cx="450" cy="380" r="250" fill="none" stroke="#16c79a" stroke-width="0.4" stroke-opacity="0.12" stroke-dasharray="3 5"/>

  <!-- Lines -->
  <line x1="450" y1="330" x2="450" y2="200" stroke="#f5a623" stroke-width="1.2" stroke-opacity="0.3"/>
  <line x1="450" y1="330" x2="270" y2="470" stroke="#f5a623" stroke-width="1.2" stroke-opacity="0.3"/>
  <line x1="450" y1="330" x2="630" y2="470" stroke="#f5a623" stroke-width="0.8" stroke-opacity="0.15" stroke-dasharray="4 3"/>
  <line x1="450" y1="200" x2="630" y2="290" stroke="#16c79a" stroke-width="1.2" stroke-opacity="0.3"/>
  <line x1="450" y1="200" x2="630" y2="470" stroke="#16c79a" stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="4 3"/>
  <line x1="450" y1="200" x2="450" y2="560" stroke="#16c79a" stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="4 3"/>
  <line x1="270" y1="470" x2="450" y2="200" stroke="#9b59b6" stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="4 3"/>
  <line x1="270" y1="290" x2="450" y2="200" stroke="#e17055" stroke-width="0.8" stroke-opacity="0.15"/>

  <!-- Crypto (centre, r=90) -->
  <polygon points="450,290 528,335 528,425 450,470 372,425 372,335" fill="#1a1400" stroke="#f5a623" stroke-width="2"/>
  <text x="450" y="377" font-size="11" font-weight="600" fill="#f5a623" text-anchor="middle">Crypto</text>
  <text x="450" y="393" font-size="8" fill="#94a3b8" text-anchor="middle">4</text>

  <!-- Identity (top, r=90) -->
  <polygon points="450,110 528,155 528,245 450,290 372,245 372,155" fill="#0a1f14" stroke="#16c79a" stroke-width="2"/>
  <text x="450" y="197" font-size="11" font-weight="600" fill="#16c79a" text-anchor="middle">Identity</text>
  <text x="450" y="213" font-size="8" fill="#94a3b8" text-anchor="middle">10</text>

  <!-- Agents (top-right, r=90) -->
  <polygon points="630,200 708,245 708,335 630,380 552,335 552,245" fill="#001a24" stroke="#00b4d8" stroke-width="2"/>
  <text x="630" y="287" font-size="11" font-weight="600" fill="#00b4d8" text-anchor="middle">Agents</text>
  <text x="630" y="303" font-size="8" fill="#94a3b8" text-anchor="middle">1</text>

  <!-- L402 (bottom-right, r=90) -->
  <polygon points="630,380 708,425 708,515 630,560 552,515 552,425" fill="#1f0a14" stroke="#e94560" stroke-width="2"/>
  <text x="630" y="467" font-size="11" font-weight="600" fill="#e94560" text-anchor="middle">L402</text>
  <text x="630" y="483" font-size="8" fill="#94a3b8" text-anchor="middle">9</text>

  <!-- Trust (bottom-left, r=90) -->
  <polygon points="270,380 348,425 348,515 270,560 192,515 192,425" fill="#1a0f24" stroke="#9b59b6" stroke-width="2"/>
  <text x="270" y="467" font-size="11" font-weight="600" fill="#9b59b6" text-anchor="middle">Trust</text>
  <text x="270" y="483" font-size="8" fill="#94a3b8" text-anchor="middle">2</text>

  <!-- Compliance (top-left, r=90) -->
  <polygon points="270,200 348,245 348,335 270,380 192,335 192,245" fill="#1f0f0a" stroke="#e17055" stroke-width="2"/>
  <text x="270" y="287" font-size="11" font-weight="600" fill="#e17055" text-anchor="middle">Compliance</text>
  <text x="270" y="303" font-size="8" fill="#94a3b8" text-anchor="middle">1</text>

  <!-- Spatial (bottom, r=90) -->
  <polygon points="450,470 528,515 528,605 450,650 372,605 372,515" fill="#0a0f1f" stroke="#0f3460" stroke-width="2"/>
  <text x="450" y="557" font-size="11" font-weight="600" fill="#0f3460" text-anchor="middle">Spatial</text>
  <text x="450" y="573" font-size="8" fill="#94a3b8" text-anchor="middle">3</text>

  <!-- Legend -->
  <line x1="730" y1="650" x2="750" y2="650" stroke="#f5a623" stroke-width="1.2" stroke-opacity="0.5"/>
  <text x="756" y="653" font-size="8" fill="#64748b">depends on</text>
  <line x1="730" y1="666" x2="750" y2="666" stroke="#64748b" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="4 3"/>
  <text x="756" y="669" font-size="8" fill="#64748b">integrates with</text>

</svg>
