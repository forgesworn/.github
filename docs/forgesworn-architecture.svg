<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="system-ui, -apple-system, sans-serif">

  <rect width="760" height="620" fill="#0a0a0f" rx="8"/>

  <text x="380" y="32" font-size="15" font-weight="600" fill="#e2e8f0" text-anchor="middle">ForgeSworn Ecosystem</text>
  <text x="380" y="50" font-size="10" fill="#64748b" text-anchor="middle">34 open-source tools built from the inside out</text>

  <!-- Rings -->
  <circle cx="380" cy="320" r="95" fill="none" stroke="#f5a623" stroke-width="0.4" stroke-opacity="0.15" stroke-dasharray="2 4"/>
  <circle cx="380" cy="320" r="200" fill="none" stroke="#16c79a" stroke-width="0.4" stroke-opacity="0.15" stroke-dasharray="2 4"/>

  <!-- Lines -->
  <line x1="380" y1="280" x2="380" y2="170" stroke="#f5a623" stroke-width="1.2" stroke-opacity="0.3"/>
  <line x1="380" y1="280" x2="236" y2="400" stroke="#f5a623" stroke-width="1.2" stroke-opacity="0.3"/>
  <line x1="380" y1="280" x2="524" y2="400" stroke="#f5a623" stroke-width="0.8" stroke-opacity="0.15" stroke-dasharray="4 3"/>
  <line x1="380" y1="170" x2="524" y2="240" stroke="#16c79a" stroke-width="1.2" stroke-opacity="0.3"/>
  <line x1="380" y1="170" x2="524" y2="400" stroke="#16c79a" stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="4 3"/>
  <line x1="380" y1="170" x2="380" y2="480" stroke="#16c79a" stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="4 3"/>
  <line x1="236" y1="400" x2="380" y2="170" stroke="#9b59b6" stroke-width="0.8" stroke-opacity="0.12" stroke-dasharray="4 3"/>
  <line x1="236" y1="240" x2="380" y2="170" stroke="#e17055" stroke-width="0.8" stroke-opacity="0.15"/>

  <!-- Crypto (centre) -->
  <polygon points="380,240 450,280 450,360 380,400 310,360 310,280" fill="#1a1400" stroke="#f5a623" stroke-width="2"/>
  <text x="380" y="317" font-size="12" font-weight="600" fill="#f5a623" text-anchor="middle">Crypto</text>
  <text x="380" y="333" font-size="9" fill="#94a3b8" text-anchor="middle">4</text>

  <!-- Identity (top) -->
  <polygon points="380,80 450,120 450,200 380,240 310,200 310,120" fill="#0a1f14" stroke="#16c79a" stroke-width="2"/>
  <text x="380" y="157" font-size="12" font-weight="600" fill="#16c79a" text-anchor="middle">Identity</text>
  <text x="380" y="173" font-size="9" fill="#94a3b8" text-anchor="middle">10</text>

  <!-- Agents (top-right) -->
  <polygon points="524,160 594,200 594,280 524,320 454,280 454,200" fill="#001a24" stroke="#00b4d8" stroke-width="2"/>
  <text x="524" y="237" font-size="12" font-weight="600" fill="#00b4d8" text-anchor="middle">Agents</text>
  <text x="524" y="253" font-size="9" fill="#94a3b8" text-anchor="middle">1</text>

  <!-- L402 (bottom-right) -->
  <polygon points="524,320 594,360 594,440 524,480 454,440 454,360" fill="#1f0a14" stroke="#e94560" stroke-width="2"/>
  <text x="524" y="397" font-size="12" font-weight="600" fill="#e94560" text-anchor="middle">L402</text>
  <text x="524" y="413" font-size="9" fill="#94a3b8" text-anchor="middle">9</text>

  <!-- Trust (bottom-left) -->
  <polygon points="236,320 306,360 306,440 236,480 166,440 166,360" fill="#1a0f24" stroke="#9b59b6" stroke-width="2"/>
  <text x="236" y="397" font-size="12" font-weight="600" fill="#9b59b6" text-anchor="middle">Trust</text>
  <text x="236" y="413" font-size="9" fill="#94a3b8" text-anchor="middle">2</text>

  <!-- Compliance (top-left) -->
  <polygon points="236,160 306,200 306,280 236,320 166,280 166,200" fill="#1f0f0a" stroke="#e17055" stroke-width="2"/>
  <text x="236" y="237" font-size="11" font-weight="600" fill="#e17055" text-anchor="middle">Compliance</text>
  <text x="236" y="253" font-size="9" fill="#94a3b8" text-anchor="middle">1</text>

  <!-- Spatial (bottom) -->
  <polygon points="380,400 450,440 450,520 380,560 310,520 310,440" fill="#0a0f1f" stroke="#0f3460" stroke-width="2"/>
  <text x="380" y="477" font-size="12" font-weight="600" fill="#0f3460" text-anchor="middle">Spatial</text>
  <text x="380" y="493" font-size="9" fill="#94a3b8" text-anchor="middle">3</text>

  <!-- Legend -->
  <line x1="600" y1="560" x2="618" y2="560" stroke="#f5a623" stroke-width="1.2" stroke-opacity="0.5"/>
  <text x="624" y="563" font-size="8" fill="#64748b">depends on</text>
  <line x1="600" y1="575" x2="618" y2="575" stroke="#64748b" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="4 3"/>
  <text x="624" y="578" font-size="8" fill="#64748b">integrates with</text>

</svg>
