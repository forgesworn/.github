<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 660" font-family="'JetBrains Mono', 'SF Mono', 'Fira Code', monospace">
  <defs>
    <style>
      .hex-label { font-size: 14px; font-weight: 600; text-anchor: middle; }
      .hex-count { font-size: 11px; font-weight: 400; fill: #94a3b8; text-anchor: middle; }
      .title { font-size: 16px; font-weight: 600; fill: #e2e8f0; text-anchor: middle; }
      .subtitle { font-size: 11px; font-weight: 400; fill: #64748b; text-anchor: middle; }
      a:hover polygon { stroke-width: 3.5; filter: brightness(1.3); }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="660" fill="#0a0a0f" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" class="title">ForgeSworn Ecosystem</text>
  <text x="400" y="52" class="subtitle">34 open-source tools built from the inside out</text>

  <!-- Architecture rings -->
  <circle cx="400" cy="340" r="100" fill="none" stroke="#f5a623" stroke-width="0.5" stroke-opacity="0.12" stroke-dasharray="2 4"/>
  <circle cx="400" cy="340" r="210" fill="none" stroke="#16c79a" stroke-width="0.5" stroke-opacity="0.12" stroke-dasharray="2 4"/>

  <!-- Connection lines -->
  <line x1="400" y1="300" x2="400" y2="180" stroke="#f5a623" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="400" y1="300" x2="248" y2="428" stroke="#f5a623" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="400" y1="300" x2="552" y2="428" stroke="#f5a623" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 3"/>
  <line x1="400" y1="180" x2="552" y2="252" stroke="#16c79a" stroke-width="1.5" stroke-opacity="0.35"/>
  <line x1="400" y1="180" x2="552" y2="428" stroke="#16c79a" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 3"/>
  <line x1="400" y1="180" x2="400" y2="508" stroke="#16c79a" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 3"/>
  <line x1="248" y1="428" x2="400" y2="180" stroke="#9b59b6" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 3"/>
  <line x1="248" y1="252" x2="400" y2="180" stroke="#e17055" stroke-width="1" stroke-opacity="0.2"/>

  <!-- CORE: Crypto -> identity-stack.md (crypto primitives section) -->
  <a xlink:href="identity-stack.md#cryptographic-foundation" target="_blank">
    <g transform="translate(400,340)">
      <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="#1a1400" stroke="#f5a623" stroke-width="2.5" cursor="pointer"/>
      <text y="-8" class="hex-label" fill="#f5a623">Crypto</text>
      <text y="12" class="hex-count">4 libraries</text>
    </g>
  </a>

  <!-- Identity -> identity-stack.md -->
  <a xlink:href="identity-stack.md" target="_blank">
    <g transform="translate(400,160)">
      <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="#0a1f14" stroke="#16c79a" stroke-width="2.5" cursor="pointer"/>
      <text y="-8" class="hex-label" fill="#16c79a">Identity</text>
      <text y="12" class="hex-count">10 repos</text>
    </g>
  </a>

  <!-- Agents -> bray repo -->
  <a xlink:href="https://github.com/forgesworn/bray" target="_blank">
    <g transform="translate(552,250)">
      <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="#001a24" stroke="#00b4d8" stroke-width="2.5" cursor="pointer"/>
      <text y="-8" class="hex-label" fill="#00b4d8">Agents</text>
      <text y="12" class="hex-count">1 repo</text>
    </g>
  </a>

  <!-- L402 -> l402-pipeline.md -->
  <a xlink:href="l402-pipeline.md" target="_blank">
    <g transform="translate(552,430)">
      <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="#1f0a14" stroke="#e94560" stroke-width="2.5" cursor="pointer"/>
      <text y="-8" class="hex-label" fill="#e94560">L402</text>
      <text y="12" class="hex-count">9 repos</text>
    </g>
  </a>

  <!-- Trust -> nostr-attestations repo -->
  <a xlink:href="https://github.com/forgesworn/nostr-attestations" target="_blank">
    <g transform="translate(248,430)">
      <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="#1a0f24" stroke="#9b59b6" stroke-width="2.5" cursor="pointer"/>
      <text y="-8" class="hex-label" fill="#9b59b6">Trust</text>
      <text y="12" class="hex-count">2 repos</text>
    </g>
  </a>

  <!-- Compliance -> jurisdiction-kit repo -->
  <a xlink:href="https://github.com/forgesworn/jurisdiction-kit" target="_blank">
    <g transform="translate(248,250)">
      <polygon points="0,-65 56,-32.5 56,32.5 0,65 -56,32.5 -56,-32.5" fill="#1f0f0a" stroke="#e17055" stroke-width="2" cursor="pointer"/>
      <text y="-6" class="hex-label" fill="#e17055" font-size="13">Compliance</text>
      <text y="14" class="hex-count">1 repo</text>
    </g>
  </a>

  <!-- Spatial -> rendezvous-kit repo -->
  <a xlink:href="https://github.com/forgesworn/rendezvous-kit" target="_blank">
    <g transform="translate(400,520)">
      <polygon points="0,-65 56,-32.5 56,32.5 0,65 -56,32.5 -56,-32.5" fill="#0a0f1f" stroke="#0f3460" stroke-width="2" cursor="pointer"/>
      <text y="-6" class="hex-label" fill="#0f3460" font-size="13">Spatial</text>
      <text y="14" class="hex-count">3 repos</text>
    </g>
  </a>

  <!-- Legend -->
  <g transform="translate(640,600)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#f5a623" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="26" y="4" style="font-size:9px;fill:#64748b">depends on</text>
    <line x1="0" y1="16" x2="20" y2="16" stroke="#64748b" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 3"/>
    <text x="26" y="20" style="font-size:9px;fill:#64748b">integrates with</text>
  </g>

</svg>
